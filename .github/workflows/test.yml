name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Vendor chematic (sparse + patch)
        run: ./scripts/vendor-chematic.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Install package (no RDKit) and build extension
        run: |
          uv sync --group dev
          uv run maturin develop -m crates/xenosite-forest/Cargo.toml --features python,extension-module
      - name: Show package version
        run: uv run python -c "import xenosite.forest as m; print(m.__version__); assert m.available()"
      - name: Rust product tests (no RDKit)
        run: uv run pytest tests/forest/rust -n auto --tb=short
      - name: Public stub must not import RDKit
        run: |
          uv run python - <<'PY'
          import sys
          assert "rdkit" not in sys.modules
          import xenosite.forest
          assert "rdkit" not in sys.modules
          print("stub ok without rdkit")
          PY

  pytest-native-legacy:
    runs-on: ubuntu-latest
    # pynauty sdist configures nauty with CFLAGS='-O4 -fPIC', which lets
    # nauty add -march=native. GHA runners differ; a uv-cached native wheel
    # then SIGILLs on a weaker CPU (pdobsan/pynauty#49). Force a baseline ISA
    # so configure skips native. cache-suffix busts prior native-built wheels.
    env:
      CC: "gcc -march=x86-64 -mtune=generic"
      CXX: "g++ -march=x86-64 -mtune=generic"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: portable-x86-64
      - name: Cache Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/forest/native/test_bfs_fuzz.py', 'uv.lock') }}
          restore-keys: |
            hypothesis-${{ runner.os }}-py${{ matrix.python-version }}-
            hypothesis-${{ runner.os }}-
      - name: Install package with RDKit extras
        run: uv sync --extra rdkit --extra network --group dev
      - name: Native + legacy suites
        run: uv run pytest tests/forest/native tests/forest/legacy src/xenosite/forest/native -n auto --cov=xenosite.forest --cov-report=term-missing

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Vendor chematic (sparse + patch)
        run: ./scripts/vendor-chematic.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p xenosite-forest --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test -p xenosite-forest
      - name: PyO3
        run: |
          cargo clippy -p xenosite-forest --all-targets --features python --no-deps -- -D warnings
          cargo test -p xenosite-forest --features python
      - name: WASM
        run: cargo build -p xenosite-forest --target wasm32-unknown-unknown --features wasm

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-suffix: portable-x86-64
      - name: Install package and dev extras
        run: uv sync --extra rdkit --extra network --group dev
      - name: Ruff (forest package + tests)
        run: uv run ruff check src/xenosite/forest tests/forest
      - name: Pyright (forest src; legacy excluded in pyproject)
        run: uv run pyright src/xenosite/forest
