  definition: Template naming both ends of a bond site.
  synonyms:
  - bond_endpoints_template
- id: xrm:1600218
  name: ring index template
  definition: Template naming a ring by index/system.
  synonyms:
  - ring_index_template
- id: xrm:1600219
  name: heteroatom symbol template
  definition: Template inserting N/O/S/halogen symbol.
