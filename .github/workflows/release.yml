# Tag-gated release: a v* tag only produces release artifacts if tests pass.
# Pushing a tag always creates the git tag; this workflow refuses to publish
# a GitHub Release / PyPI upload unless the suite is green.
#
# PyPI uses Trusted Publishing (OIDC) — no API token secret. One-time setup:
#   1. GitHub → Settings → Environments → create "pypi"
#   2. PyPI → Publishing → add pending trusted publisher:
#        owner: swamidasslab
#        repo: xenosite-forest
#        workflow: release.yml
#        environment: pypi
# Docs: https://docs.pypi.org/trusted-publishers/
#
# Harder enforcement (block creating tags unless checks pass) needs a GitHub
# Ruleset on tag refs requiring this workflow — optional org/repo setting.

name: release

on:
  push:
    tags: ["v*"]

env:
  # Pin for reproducibility across maturin-action jobs.
  MATURIN_VERSION: v1.9.4
  CARGO_PACKAGE_VERSION_FILE: crates/xenosite-forest/Cargo.toml

jobs:
  test:
    runs-on: ubuntu-latest
    # Same portable pynauty/nauty build as test.yml (pdobsan/pynauty#49).
    env:
      CC: "gcc -march=x86-64 -mtune=generic"
      CXX: "g++ -march=x86-64 -mtune=generic"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: portable-x86-64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Install package (builds Rust extension via maturin)
        run: uv sync --extra rdkit --extra network --group dev
      - name: Show package version
        run: uv run python -c "import xenosite.forest as m; print(m.__version__); assert m.available()"
      - name: Require Cargo version matches tag
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          PKG_VER=$(uv run python -c "import xenosite.forest as m; print(m.__version__)")
          echo "tag=$TAG_VER cargo=$CARGO_VER package=$PKG_VER"
          test "$TAG_VER" = "$CARGO_VER"
          test "$TAG_VER" = "$PKG_VER"
          case "$PKG_VER" in
            *dev*|*+*|*.d[0-9]*)
              echo "Tagged builds must resolve to a clean X.Y.Z (got $PKG_VER)"
              exit 1
              ;;
          esac
      - name: Full forest suite (public stub + native + legacy)
        run: uv run pytest tests/forest -n auto --cov=xenosite.forest --cov-report=term-missing

  linux:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build musllinux wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
          rust-toolchain: "1.88.0"
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  js:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@swamidasslab"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build wasm + Node smokes
        run: |
          ./scripts/build_wasm.sh
          cd js
          npm ci
          npm test
          npm run build:ts
          npm run build:copy-wasm
      - name: Version from tag
        working-directory: js
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Publishing JS version $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version
      - name: Retarget package name for GitHub Packages
        working-directory: js
        run: |
          npm pkg set name=@swamidasslab/forest
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set publishConfig.access=public
          node -p "require('./package.json').name + '@' + require('./package.json').version"
      - name: Publish to GitHub Packages
        working-directory: js
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload npm pack artifact
        working-directory: js
        run: |
          npm pack
          mkdir -p ../dist-js
          mv swamidasslab-forest-*.tgz ../dist-js/ 2>/dev/null || mv xenosite-forest-*.tgz ../dist-js/ 2>/dev/null || mv *.tgz ../dist-js/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-forest
          path: dist-js/

  changelog:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version without v prefix
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compile CHANGELOG.md from towncrier fragments
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          if grep -Eq "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has [${VERSION}]"
          else
            uvx towncrier build --yes --version "$VERSION"
          fi
          git add CHANGELOG.md changelog.d
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "Update CHANGELOG.md for ${GITHUB_REF_NAME}."
          git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}" || \
            echo "::warning::Could not fast-forward default branch with CHANGELOG.md."

  publish:
    needs: [linux, musllinux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xenosite-forest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List dist
        run: ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
