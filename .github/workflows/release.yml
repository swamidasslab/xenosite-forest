# Tag-gated release: a v* tag only produces release artifacts if tests pass.
# Pushing a tag always creates the git tag; this workflow refuses to publish
# a GitHub Release / PyPI upload unless the suite is green.
#
# Version always comes from the tag in each build/publish job via
# scripts/set_release_version.py (Cargo.toml / Cargo.lock / js/package.json).
# Builds do not depend on the post-release housekeeping commit on main.
#
# After PyPI (+ JS) publish succeeds, the changelog job checks out the
# default branch tip, applies towncrier + the same version rewrite, and
# pushes the housekeeping commit. That ordering avoids racing main and
# keeps publish independent of whether the bump landed.
#
# Protect main blocks GITHUB_TOKEN pushes. One-time: create a classic PAT
# (or fine-grained: Contents R/W on this repo) for an account that can bypass
# Protect main, then:
#   gh secret set RELEASE_PUSH_TOKEN --repo swamidasslab/xenosite-forest
# The changelog job checks out + pushes with that secret. See .github/PUBLISH.md.
#
# PyPI uses Trusted Publishing (OIDC) — no API token secret. One-time setup:
#   1. GitHub → Settings → Environments → create "pypi"
#   2. PyPI → Publishing → add pending trusted publisher:
#        owner: swamidasslab
#        repo: xenosite-forest
#        workflow: release.yml
#        environment: pypi
# Docs: https://docs.pypi.org/trusted-publishers/
#
# Harder enforcement (block creating tags unless checks pass) needs a GitHub
# Ruleset on tag refs requiring this workflow — optional org/repo setting.

name: release

on:
  push:
    tags: ["v*"]

env:
  # Pin for reproducibility across maturin-action jobs.
  MATURIN_VERSION: v1.9.4
  CARGO_PACKAGE_VERSION_FILE: crates/xenosite-forest/Cargo.toml

jobs:
  test:
    runs-on: ubuntu-latest
    # Same portable pynauty/nauty build as test.yml (pdobsan/pynauty#49).
    env:
      CC: "gcc -march=x86-64 -mtune=generic"
      CXX: "g++ -march=x86-64 -mtune=generic"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set package version from tag
        run: python3 scripts/set_release_version.py
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: portable-x86-64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Install package (builds Rust extension via maturin)
        run: uv sync --extra rdkit --extra network --group dev
      - name: Show package version
        run: uv run python -c "import xenosite.forest as m; print(m.__version__); assert m.available()"
      - name: Require built package version matches tag
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          PKG_VER=$(uv run python -c "import xenosite.forest as m; print(m.__version__)")
          echo "tag=$TAG_VER cargo=$CARGO_VER package=$PKG_VER"
          test "$TAG_VER" = "$CARGO_VER"
          test "$TAG_VER" = "$PKG_VER"
          case "$PKG_VER" in
            *dev*|*+*|*.d[0-9]*)
              echo "Tagged builds must resolve to a clean X.Y.Z (got $PKG_VER)"
              exit 1
              ;;
          esac
      - name: Forest suite (product door + native; no legacy)
        run: make test-python

  linux:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set package version from tag
        run: |
          set -euo pipefail
          python scripts/set_release_version.py
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          echo "tag=$TAG_VER cargo=$CARGO_VER"
          test "$TAG_VER" = "$CARGO_VER"
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set package version from tag
        run: |
          set -euo pipefail
          python scripts/set_release_version.py
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          echo "tag=$TAG_VER cargo=$CARGO_VER"
          test "$TAG_VER" = "$CARGO_VER"
      - name: Build musllinux wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set package version from tag
        run: |
          set -euo pipefail
          python scripts/set_release_version.py
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          echo "tag=$TAG_VER cargo=$CARGO_VER"
          test "$TAG_VER" = "$CARGO_VER"
      - name: Build macOS wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Set package version from tag
        shell: bash
        run: |
          set -euo pipefail
          python scripts/set_release_version.py
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          echo "tag=$TAG_VER cargo=$CARGO_VER"
          test "$TAG_VER" = "$CARGO_VER"
      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          rust-toolchain: "1.88.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set package version from tag
        run: |
          set -euo pipefail
          python scripts/set_release_version.py
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          echo "tag=$TAG_VER cargo=$CARGO_VER"
          test "$TAG_VER" = "$CARGO_VER"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
          rust-toolchain: "1.88.0"
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  js:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set package version from tag
        run: |
          set -euo pipefail
          python3 scripts/set_release_version.py
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          JS_VER=$(python3 -c "import json; print(json.load(open('js/package.json'))['version'])")
          echo "tag=$TAG_VER cargo=$CARGO_VER js=$JS_VER"
          test "$TAG_VER" = "$CARGO_VER"
          test "$TAG_VER" = "$JS_VER"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@swamidasslab"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build wasm + Node smokes
        run: |
          ./scripts/build_wasm.sh
          cd js
          npm ci
          npm test
          npm run build:ts
          npm run build:copy-wasm
      - name: Retarget package name for GitHub Packages
        working-directory: js
        run: |
          npm pkg set name=@swamidasslab/forest
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set publishConfig.access=public
          node -p "require('./package.json').name + '@' + require('./package.json').version"
      - name: Publish to GitHub Packages
        working-directory: js
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload npm pack artifact
        working-directory: js
        run: |
          npm pack
          mkdir -p ../dist-js
          mv swamidasslab-forest-*.tgz ../dist-js/ 2>/dev/null || mv xenosite-forest-*.tgz ../dist-js/ 2>/dev/null || mv *.tgz ../dist-js/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-forest
          path: dist-js/

  publish:
    needs: [linux, musllinux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xenosite-forest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List dist
        run: ls -la dist
      - name: Require artifact versions match tag
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifacts in dist/"
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            case "$base" in
              *"-$TAG_VER-"*|*"-$TAG_VER."*|*"-$TAG_VER.tar."*)
                ;;
              *)
                echo "::error::Artifact version mismatch for tag $TAG_VER: $base"
                bad=1
                ;;
            esac
          done
          test "$bad" -eq 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Housekeeping only: never gates publish. Runs on tip of default branch so
  # concurrent main commits cannot non-fast-forward the bump push.
  changelog:
    needs: [publish, js]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require RELEASE_PUSH_TOKEN
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set repo secret RELEASE_PUSH_TOKEN (PAT that can bypass Protect main). See .github/PUBLISH.md"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tip of main (not the tag): apply bump as a forward commit.
          ref: ${{ github.event.repository.default_branch }}
          # Bypass Protect main: PAT of a ruleset-bypass user (not GITHUB_TOKEN).
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Version without v prefix
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compile CHANGELOG.md and commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          # Tip of main at push time (main may have moved during publish/js).
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          python3 scripts/set_release_version.py
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_PACKAGE_VERSION_FILE" | head -1)
          echo "tag=$VERSION cargo=$CARGO_VER"
          test "$VERSION" = "$CARGO_VER"
          if grep -Eq "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has [${VERSION}]"
          else
            uvx towncrier build --yes --version "$VERSION"
          fi
          git add CHANGELOG.md changelog.d \
            crates/xenosite-forest/Cargo.toml Cargo.lock js/package.json
          if git diff --cached --quiet; then
            echo "No release housekeeping changes to commit"
            exit 0
          fi
          git commit -m "Release ${GITHUB_REF_NAME}: changelog + package versions."
          # Retry once if main advanced between reset and push.
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
