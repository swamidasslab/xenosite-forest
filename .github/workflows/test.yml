name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRs: lint only (ruff / pyright / rustfmt / clippy / WASM compile).
# Main: fast smoke — single Python 3.12, make test-python-smoke,
# make test-rust-smoke (no ms1_apply_fuzz), full cargo --features python + JS.
# Tags: release.yml runs the full multi-Python suite and blocks publish on fail.
# Defaults (make test / make test-python) stay the whole suite locally.
# If Protect main required checks drift from this file, PRs become unmergeable.
# PR gates should be contexts that still run on pull_request: ``lint`` + ``rust``.
# (pytest / js are main-only; do not require those on PRs.)

jobs:
  pytest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # pynauty sdist configures nauty with CFLAGS='-O4 -fPIC', which lets
    # nauty add -march=native. GHA runners differ; a uv-cached native wheel
    # then SIGILLs on a weaker CPU (pdobsan/pynauty#49). Force a baseline ISA
    # so configure skips native. cache-suffix busts prior native-built wheels.
    env:
      CC: "gcc -march=x86-64 -mtune=generic"
      CXX: "g++ -march=x86-64 -mtune=generic"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-suffix: portable-x86-64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Cache Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-py3.12-${{ hashFiles('tests/forest/native/test_bfs_fuzz.py', 'uv.lock') }}
          restore-keys: |
            hypothesis-${{ runner.os }}-py3.12-
            hypothesis-${{ runner.os }}-
      - name: Install package (RDKit extras; maturin builds the Rust extension)
        run: uv sync --extra rdkit --extra network --group dev
      - name: Show package version
        run: uv run python -c "import xenosite.forest as m; print(m.__version__); assert m.available()"
      - name: Product-door smoke (rust wrapper + focused parity)
        run: make test-python-smoke

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p xenosite-forest --all-targets --no-deps -- -D warnings
      - name: Clippy (python feature)
        run: cargo clippy -p xenosite-forest --all-targets --features python --no-deps -- -D warnings
      - name: WASM
        run: cargo build -p xenosite-forest --target wasm32-unknown-unknown --features wasm
      - name: Test
        if: github.event_name != 'pull_request'
        run: make test-rust-smoke
      - name: PyO3 tests
        if: github.event_name != 'pull_request'
        run: make test-rust-python

  js:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build wasm + Node smokes
        run: |
          ./scripts/build_wasm.sh
          cd js
          npm ci
          npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-suffix: portable-x86-64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Install package and dev extras
        run: uv sync --extra rdkit --extra network --group dev
      - name: Ruff (forest package + tests)
        run: uv run ruff check src/xenosite/forest tests/forest
      - name: Pyright (forest src; legacy excluded in pyproject)
        run: uv run pyright src/xenosite/forest
