# Localization / display-name templates — NOT ontology concepts.
# Used by AnnotationBundle::site_label and future name generators.
templates:
- id: xrm:1600147
  name: canonical site name template
  definition: Template for generating localized site names dynamically.
  synonyms:
  - site_label template
  - canonical_site_name_template
- id: xrm:1600148
  name: attachment atom template
  definition: Template for conjugation attachment-atom localization.
  synonyms:
  - attachment_atom_template
- id: xrm:1600149
  name: map-number localization
  definition: Localization by atom-map number.
  synonyms:
  - '@map localization'
  - map_number_localization
- id: xrm:1600150
  name: atom-index localization
  definition: Localization by reactant atom index when maps absent.
  synonyms:
  - atom_index_localization
- id: xrm:1600200
  name: atom site template
  definition: Template localizing a reaction to an atom site.
  synonyms:
  - atom_site
  - atom_site_template
- id: xrm:1600201
  name: bond site template
  definition: Template localizing a reaction to a bond site.
  synonyms:
  - bond_site
  - bond_site_template
- id: xrm:1600202
  name: ring site template
  definition: Template localizing a reaction to a ring site.
  synonyms:
  - ring_site
  - ring_site_template
- id: xrm:1600203
  name: attachment atom template O
  definition: Template for O-attachment localization.
  synonyms:
  - attachment_atom_template_o
- id: xrm:1600204
  name: attachment atom template N
  definition: Template for N-attachment localization.
  synonyms:
  - attachment_atom_template_n
- id: xrm:1600205
  name: attachment atom template S
  definition: Template for S-attachment localization.
  synonyms:
  - attachment_atom_template_s
- id: xrm:1600206
  name: attachment atom template C
  definition: Template for C-attachment localization.
  synonyms:
  - attachment_atom_template_c
- id: xrm:1600207
  name: attachment atom template acyl
  definition: Template for acyl-attachment localization.
  synonyms:
  - attachment_atom_template_acyl
- id: xrm:1600208
  name: canonical site name
  definition: Canonical generated site-localized display name.
  synonyms:
  - canonical_site_name
- id: xrm:1600209
  name: map-number site label
  definition: Site label using atom-map numbers (e.g. @1).
  synonyms:
  - map_number_site_label
- id: xrm:1600210
  name: element-index site label
  definition: Site label using element + index (e.g. C7).
