[package]
name = "xenosite-forest"
version = "0.10.2"
edition = "2024"
rust-version = "1.88"
license-file = "../../LICENSE"
description = "Metabolic Forest product door: chematic + canonaut (WASM-clean; PyO3 wrapper is xenosite.forest)"
repository = "https://github.com/swamidasslab/xenosite-forest"
publish = false

[lib]
name = "xenosite_forest"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# JS bindings. wasm32 getrandom backend is in the target-specific dep below.
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-wasm-bindgen",
]
# CPython class wrap (`#[pyclass]`). Native only; not wasm32-unknown-unknown.
python = ["export", "dep:pyo3", "dep:pythonize"]
export = ["dep:serde", "dep:serde_json"]
# Wheel/cdylib: do not link libpython. cargo test --features python omits this.
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
# 1.0.27+ ships caller atom tags + SMILES visit-order helpers (no local patch).
chematic = { version = "1.0.27", default-features = false, features = [
    "smiles",
    "smarts",
    "rxn",
    "perception",
    "chem",
] }
canonaut = "1.0.0"
log = "0.4"
# Rust-only inflate for embedded SSSOM (no C zlib; wasm-clean).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
pyo3 = { version = "0.26", optional = true }
pythonize = { version = "0.26", optional = true }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# `std` required for FileFailurePersistence (proptest-regressions/).
proptest = { version = "1.11", features = ["std"] }
rayon = "1.10"

# Newer rustc emits bulk-memory / saturating float ops; enable all features for
# the wasm-opt shipped with wasm-pack (same as xenosite-pict).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]

