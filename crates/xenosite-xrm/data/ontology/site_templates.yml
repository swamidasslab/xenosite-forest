- id: xrm:1600221
  name: benzylic position template
  definition: Template for benzylic position naming.
  synonyms:
  - benzylic_position_template
- id: xrm:1600222
  name: allylic position template
  definition: Template for allylic position naming.
  synonyms:
  - allylic_position_template
- id: xrm:1600223
  name: aniline nitrogen template
  definition: Template for aniline N localization.
  synonyms:
  - aniline_nitrogen_template
- id: xrm:1600224
  name: phenol oxygen template
  definition: Template for phenolic O localization.
  synonyms:
  - phenol_oxygen_template
- id: xrm:1600225
  name: tertiary amine nitrogen template
  definition: Template for tertiary amine N localization.
  synonyms:
  - tertiary_amine_nitrogen_template
- id: xrm:1600226
  name: site environment phrase template
  definition: Phrase combining site environment + reaction.
  synonyms:
  - site_environment_phrase_template
- id: xrm:1600227
  name: underspecified site template
  definition: Display when site localization is ambiguous.
  synonyms:
  - underspecified_site_template
- id: xrm:1900106
  name: site template expansion
  definition: Localized label generated from a site template (not a concept).
  synonyms:
  - site_template_expansion
