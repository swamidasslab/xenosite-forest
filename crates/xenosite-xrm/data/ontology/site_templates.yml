  definition: Ortho/meta/para (or similar) regio descriptor.
  synonyms:
  - regio_descriptor_template
- id: xrm:1600215
  name: stereo descriptor template
  definition: Stereo descriptor in a localized name.
  synonyms:
  - stereo_descriptor_template
- id: xrm:1600216
