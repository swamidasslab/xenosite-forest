[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "xenosite-forest"
dynamic = ["version"]
description = "Metabolic Forest: enumerate metabolite structures from reaction rules"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "rdkit>=2022.3.3",
    "pynauty",
]
keywords = ["metabolite", "metabolism", "rdkit", "xenosite", "metabolic-forest"]

[project.optional-dependencies]
network = [
    "networkx>=3.2.1",
    "tqdm>=4.66.0",
]
# Downstream predictors; not installed on CI (workflows use --extra network only).
predict = [
    "xenosite-predict>=0.4.2",
]

[project.urls]
Homepage = "https://xenosite.org"
Documentation = "https://github.com/swamidasslab/xenosite-forest/blob/main/docs/usage.md"
Repository = "https://github.com/swamidasslab/xenosite-forest"
Issues = "https://github.com/swamidasslab/xenosite-forest/issues"
Paper = "https://doi.org/10.1021/acs.jcim.0c00360"

[project.scripts]
xenosite-forest = "xenosite.forest.bfs:main"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-xdist[psutil]>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "networkx>=3.2.1",
    "tqdm>=4.66.0",
    "hypothesis>=6.168.0",
    "towncrier>=24.0",
    "pyright>=1.1.414",
    "ruff>=0.16.8",
    "xenopict>=0.3",
]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/swamidasslab/xenosite-forest/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/swamidasslab/xenosite-forest/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.hatch.version]
source = "vcs"
# Tag releases as vX.Y.Z. On later commits: next patch + .devN + short commit
# e.g. after v0.1.0 → 0.1.1.dev3+gabc1234
tag-pattern = 'v(?P<version>\d+\.\d+\.\d+(?:[.-].+)?)'
[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/xenosite/forest/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xenosite"]
# Archive ships for StepPlan/parity imports but is not supported API.

[tool.hatch.build.targets.sdist]
include = [
    "src/xenosite",
    "tests",
    "examples",
    "docs",
    "LICENSE",
    "README.md",
    "CITATION.cff",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules -n auto --timeout=120 --import-mode=importlib"
# Collect from src so importlib resolves xenosite.forest.* and xenosite stays
# a PEP 420 namespace package (no xenosite/__init__.py).
testpaths = ["tests/forest", "src/xenosite/forest"]
pythonpath = ["src", "tests", "tests/_archive_forest"]
# tests/_archive_forest is on path only so live ports can import example SMILES
# modules (test_rules, …). Those tests are NOT collected (norecursedirs).
consider_namespace_packages = true
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
# Archived pre-swap forest + its tests stay out of the default gate.
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    ".hypothesis",
    "_archive_forest",
]
filterwarnings = [
    "error",
    # Intentional archive chemotype noise; not a live-forest contract.
    "ignore::xenosite._archive_forest.unstable.UnstableWarning",
    # Formula-delta check is soft (never drops). Suite asserts the shared
    # mismatch *collector* is empty (see tests/conftest.py); intentional
    # mismatch tests use @pytest.mark.allow_formula_delta_mismatch. Warnings
    # stay ignored so WAE does not double-fail beside the counter gate.
    "ignore::xenosite.forest.rules.FormulaDeltaMismatchWarning",
    # Deprecated AtomTracker facade: tests that call it use pytest.warns /
    # catch_warnings(ignore). Do not blanket-ignore DeprecationWarning.
    # Cross-rule overlaps log INFO only (no RedundantRulesWarning); SiteDeduplicationWarning
    # stays an error under this filterwarnings=error gate.
]
markers = [
    "profile: opt-in AtomTracker / metabolize timing benches (not a CI gate)",
    "regression: deferred bug, not correct behavior or out of scope",
    "cleared_0_7: former hard xfail that now passes on live forest (since v0.6)",
    "allow_formula_delta_mismatch: intentional FormulaDeltaMismatch records (skip suite zero-assert)",
]

[tool.coverage.run]
source_pkgs = ["xenosite.forest"]
omit = ["*/_version.py", "*/_archive_forest/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.pyright]
include = [
    "src/xenosite/forest",
]
exclude = [
    "src/xenosite/_archive_forest",
    "src/xenosite/refactor_poc/test.ipynb",
]
# Match requires-python (>=3.11). Do not assume 3.14-only PEP 649 defaults.
pythonVersion = "3.11"
# tests/forest stays out until its MolFromSmiles / TypedDict noise is cleaned.
# Local and CI: `uv run pyright src/xenosite/forest`.
# Untyped parameters error for the live forest tree. Argument / member /
# variable Unknown stay off: RDKit stubs still flood those.
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
reportUntypedFunctionDecorator = "error"
# reportImplicitOverride skipped while floor is 3.11: typing.override is 3.12+
# and typing_extensions was dropped from runtime deps. Revisit at requires-python>=3.12.

# Live forest + its tests. Archive and examples stay out.
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/xenosite/_archive_forest",
    "tests/_archive_forest",
    "examples",
    "src/xenosite/refactor_poc/test.ipynb",
    "tests/conftest.py",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade (3.11+ typing/builtins).
# Bugbear (B) is off: B905 wants zip(..., strict=) and that is a behavior change.
# UP031 (printf→format) ignored: style flood, not a typing gate.
# UP040/UP046/UP047 need 3.12+ (`type` aliases / PEP 695); gated off by
# target-version=py311 until the floor rises. No FA rules that strip
# `from __future__ import annotations` (still support 3.11–3.13).
select = ["E", "W", "F", "I", "UP"]
ignore = ["PLC0414", "UP031"]
