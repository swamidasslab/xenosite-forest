[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "xenosite-forest"
dynamic = ["version"]
description = "Metabolic Forest: enumerate metabolite structures from reaction rules"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "rdkit>=2023.9.1",
]
keywords = ["metabolite", "metabolism", "rdkit", "xenosite", "metabolic-forest"]

[project.optional-dependencies]
network = [
    "networkx>=3.2.1",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://xenosite.org"
Documentation = "https://github.com/swamidasslab/xenosite-forest/blob/main/docs/usage.md"
Repository = "https://github.com/swamidasslab/xenosite-forest"
Issues = "https://github.com/swamidasslab/xenosite-forest/issues"
Paper = "https://doi.org/10.1021/acs.jcim.0c00360"

[project.scripts]
xenosite-forest = "xenosite.forest.bfs:main"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-xdist[psutil]>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "networkx>=3.2.1",
    "tqdm>=4.66.0",
]

[tool.hatch.version]
source = "vcs"
# Tag releases as vX.Y.Z. On later commits: next patch + .devN + short commit
# e.g. after v0.1.0 → 0.1.1.dev3+gabc1234
tag-pattern = 'v(?P<version>\d+\.\d+\.\d+(?:[.-].+)?)'
[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/xenosite/forest/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xenosite"]

[tool.hatch.build.targets.sdist]
include = [
    "src/xenosite",
    "tests",
    "examples",
    "docs",
    "LICENSE",
    "README.md",
    "CITATION.cff",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules -n auto --timeout=120"
testpaths = ["tests", "src/xenosite/forest"]
pythonpath = ["src"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
# Avoid collecting optional network helpers unless explicitly requested
norecursedirs = [".git", ".venv", "build", "dist"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source_pkgs = ["xenosite.forest"]
omit = ["*/_version.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
