name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so hatch-vcs can derive the package version
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/test_bfs_fuzz.py', 'uv.lock') }}
          restore-keys: |
            hypothesis-${{ runner.os }}-py${{ matrix.python-version }}-
            hypothesis-${{ runner.os }}-
      - name: Install package and test extras
        run: uv sync --extra network --group dev
      - name: Show package version
        run: uv run python -c "import xenosite.forest as m; print(m.__version__)"
      - name: Run tests in parallel
        run: uv run pytest -n auto --cov=xenosite.forest --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install package and dev extras
        run: uv sync --extra network --group dev
      - name: Ruff (refactor_poc only)
        run: uv run ruff check src/xenosite/refactor_poc tests/refactor_poc
      - name: Pyright (refactor_poc src only)
        # Paths match [tool.pyright] include; tests stay out until typed clean.
        run: uv run pyright src/xenosite/refactor_poc
