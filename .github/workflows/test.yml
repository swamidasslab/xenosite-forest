name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so hatch-vcs can derive the package version
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: uv sync --extra network --group dev
      - name: Show package version
        run: uv run python -c "import xenosite.forest as m; print(m.__version__)"
      - name: Run tests in parallel
        run: uv run pytest -n auto
