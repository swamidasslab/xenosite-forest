  - element_index_site_label
- id: xrm:1600211
  name: motif-localized name template
  definition: Motif-aware localized name (e.g. para on anisole).
  synonyms:
  - motif_localized_name_template
- id: xrm:1600212
  name: product-class name template
  definition: Product-class display name (e.g. phenol formation).
  synonyms:
